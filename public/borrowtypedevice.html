<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notelet — Borrowable Devices</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo"><div class="logo-mark"></div><div class="logo-text">NOTELET</div></a>

      <nav class="nav">
        <div id="headerSearch" class="header-search hidden">
          <input id="headerSearchInput" type="search" placeholder="Search devices..." aria-label="Search devices">
          <button id="headerSearchSubmit" class="btn btn-cta">Go</button>
        </div>
        <a href="#" id="navSearchBtn">Search</a>
        <a href="#" id="headerCartBtn">Cart</a>
        <a href="#" id="headerFavBtn">Favorites</a>
        <a href="/devicehistory">History</a>
      </nav>

      <div class="header-actions">
        <a href="/rentout" class="btn btn-ghost">Rent out</a>
        <a href="/login" class="btn btn-primary">Log in</a>
      </div>
    </div>
  </header>

  <main>
    <section class="renttype-page" style="padding-top:48px;">
      <div class="container" style="text-align:center;">
        <h1 id="deviceHeader" style="font-size:56px;margin-bottom:28px;font-weight:700;color:#111;">Available to Borrow</h1>

        <div id="results" class="renttype-grid" style="margin-top:20px;">
          <!-- results will be rendered here -->
        </div>
      </div>
    </section>
  </main>
  <script src="/navpopups.js"></script>
  <script>
    (function(){
      const navSearchBtn = document.getElementById('navSearchBtn');
      const headerSearch = document.getElementById('headerSearch');
      const headerSearchInput = document.getElementById('headerSearchInput');
      const headerSearchSubmit = document.getElementById('headerSearchSubmit');
      if(!navSearchBtn || !headerSearch) return;

      function showSearch(){ navSearchBtn.style.display='none'; headerSearch.classList.remove('hidden'); headerSearchInput && headerSearchInput.focus(); }
      function hideSearch(){ headerSearch.classList.add('hidden'); navSearchBtn.style.display=''; }

      navSearchBtn.addEventListener('click',(e)=>{ e.preventDefault(); showSearch(); });
      headerSearchSubmit && headerSearchSubmit.addEventListener('click', ()=>{
        const q = headerSearchInput.value.trim(); if(!q) return; window.location.href = '/borrowtypedevice?type=search&q='+encodeURIComponent(q);
      });
      headerSearchInput && headerSearchInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); headerSearchSubmit.click(); } else if(e.key==='Escape'){ hideSearch(); } });
      document.addEventListener('click',(e)=>{ if(!headerSearch.contains(e.target) && e.target !== navSearchBtn) hideSearch(); });
    })();
  </script>

  <script>
    // borrowed-availability demo: only show items with available: true
    function getQueryParam(name){ const url = new URL(window.location.href); return url.searchParams.get(name); }
    const type = (getQueryParam('type') || 'all').toLowerCase();
    const deviceHeader = document.getElementById('deviceHeader');
    const results = document.getElementById('results');
    const q = getQueryParam('q') || '';
    let typeLabel = '';
    if(type === 'search' && q.trim()){ typeLabel = q; } else { typeLabel = type === 'others' ? 'Others' : (type.charAt(0).toUpperCase() + type.slice(1)); }
    deviceHeader.textContent = typeLabel;

    const samples = {
      notebook: [
        { id:1, name:'MacBook Pro 13"', available:true, lessor:'CSKMITL' },
        { id:2, name:'Dell XPS 13', available:false, lessor:'CSKMITL' }
      ],
      tablet: [
        { id:3, name:'iPad Air', available:true, lessor:'CSKMITL' },
        { id:4, name:'Galaxy Tab', available:true, lessor:'CSKMITL' }
      ],
      others: [
        { id:5, name:'GoPro Hero', available:false, lessor:'CSKMITL' },
        { id:6, name:'Projector', available:true, lessor:'CSKMITL' }
      ]
    };

    let items = samples[type] || [];
    if(type === 'search'){
      const all = [].concat(...Object.values(samples));
      const ql = q.toLowerCase();
      // when searching, show both renting and borrowing devices (do not filter by availability)
      items = all.filter(it => (it.name.toLowerCase().includes(ql) || it.lessor.toLowerCase().includes(ql)));
    } else {
      // filter to available only
      items = items.filter(it => it.available);
    }

    function renderCard(item){
      const card = document.createElement('article');
      card.className = 'result-card';
      // use primary/confirm blue from CSS variables for borrow cards
      card.style.background = 'var(--primary)';
      card.style.color = '#fff';
      card.innerHTML = `
        <div class="card-media-large" aria-hidden style="background:#C4DEFD;"></div>
        <div class="card-content" style="color:#fff;">
          <h3 class="device-name" style="color:#fff;">${item.name}</h3>
          
          <div class="card-divider" style="border-color:rgba(255,255,255,0.2)"></div>
          <div class="card-footer">
            <div class="avatar" aria-hidden style="background:rgba(255,255,255,0.15);"></div>
            <div class="lessee">
              <div class="lessee-name" style="color:#fff;">${item.lessor}</div>
            </div>
          </div>
        </div>
      `;
      card.tabIndex = 0;
      card.style.cursor = 'pointer';
      card.addEventListener('click', ()=>{
        const url = '/borrowdevice?id='+encodeURIComponent(item.id)+'&name='+encodeURIComponent(item.name);
        window.location.href = url;
      });
      card.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); card.click(); } });
      return card;
    }

    if(items.length === 0){ results.innerHTML = '<p>No devices available for borrowing in this category.</p>'; }
    else { items.forEach(it => results.appendChild(renderCard(it))); }
  </script>
</body>
</html>
