<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notelet — Log in</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <!-- logo is a link back to home -->
      <a href="/" class="logo" aria-label="Notelet home">
        <div class="logo-mark" aria-hidden></div>
        <div class="logo-text">NOTELET</div>
      </a>

      <!-- keep header links minimal on the login page -->
      <nav class="nav" aria-hidden></nav>

      <div class="header-actions">
        <!-- header actions left empty on login page (logo returns home) -->
      </div>
    </div>
  </header>

  <main>
    <section class="login-page">
      <div class="container" style="display:flex;justify-content:center;">
        <div class="login-card" role="main" aria-labelledby="login-heading">
          <div id="login-heading" class="login-head">Log in</div>

          <form id="loginForm" method="POST" action="/api/login">
            <div class="form-row">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required placeholder="you@example.com">
            </div>

            <div class="form-row">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" required placeholder="••••••••">
            </div>

            <div class="login-actions">
              <button type="submit" class="btn btn-cta">Log in</button>
              <a href="/signup" class="btn btn-outline">Create account</a>
            </div>
          </form>

        </div>
      </div>
    </section>
  </main>
</body>
</html>
