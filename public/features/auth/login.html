<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notelet — Log in</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/auth.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: none;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .login-header .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: #667eea;
      text-decoration: none;
    }
    .login-header .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: 700;
    }
    .login-header .logo-text {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-title {
      font-size: 32px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
    }
    .login-subtitle {
      color: #64748b;
      font-size: 16px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      background: rgba(255, 255, 255, 1);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }
    .login-btn {
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
    }
    .login-btn:active {
      transform: translateY(0);
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .divider {
      text-align: center;
      position: relative;
      margin: 32px 0;
    }
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e5e7eb;
    }
    .divider span {
      background: rgba(255, 255, 255, 0.95);
      padding: 0 16px;
      color: #64748b;
      font-size: 14px;
    }
    .register-link {
      text-align: center;
    }
    .register-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    .register-link a:hover {
      color: #5a67d8;
    }
    .admin-link {
      text-align: center;
      margin-top: 24px;
    }
    .admin-link a {
      color: #64748b;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }
    .admin-link a:hover {
      color: #374151;
    }
    .error-message {
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      color: #b91c1c;
      font-size: 14px;
      display: none;
    }
    .home-link {
      position: absolute;
      top: 24px;
      left: 24px;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .home-link:hover {
      color: white;
    }
  </style>
</head>
<body>
  <a href="/" class="home-link">← Back to Home</a>
  
  <main>
    <section class="login-page">
      <div class="login-container">
        <div class="login-header">
          <a href="/" class="logo">
            <div class="logo-mark" aria-hidden></div>
            <div class="logo-text">NOTELET</div>
          </a>
          <h1 class="login-title">Welcome Back!</h1>
          <p class="login-subtitle">Sign in to your account</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" required placeholder="Enter your email">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required placeholder="Enter your password">
          </div>

          <button type="submit" class="login-btn" id="loginBtn">
            Sign In
          </button>
        </form>

        <div class="register-link">
          <p>Don't have an account? <a href="/features/auth/register.html">Create one here</a></p>
        </div>
        
      </div>
    </section>
  </main>
  <script>
    // Check if user is already logged in
    if (typeof NoteLetAuth !== 'undefined' && NoteLetAuth.redirectIfAuthenticated) {
      NoteLetAuth.redirectIfAuthenticated();
    }

    // Check for admin mode
    const params = new URL(window.location.href).searchParams;
    const isAdmin = params.get('admin') === '1';

    if (isAdmin) {
      document.getElementById('adminLink').style.display = 'none';
      document.querySelector('.login-title').textContent = 'Admin Login';
      document.querySelector('.login-subtitle').textContent = 'Sign in with your admin credentials';
    }

    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');
      const loginBtn = document.getElementById('loginBtn');
      
      if (!email || !password) {
        showError('Please fill in all fields');
        return;
      }

      // Disable button and show loading
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing In...';
      errorDiv.style.display = 'none';

      try {
        // Use the NoteLetAuth.login function
        if (typeof NoteLetAuth !== 'undefined' && NoteLetAuth.login) {
          const result = await NoteLetAuth.login(email, password);
          
          if (result.success) {
            // Redirect admin to admin panel, others to homepage
            const u = result.user || {};
            window.location.href = u.is_admin ? '/features/auth/devices-auth.html' : '/';
          } else {
            throw new Error(result.message || 'Login failed');
          }
        } else {
          // Fallback direct API call
          const response = await fetch('http://localhost:3001/api/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (response.ok && data.success) {
            // Save auth data
            localStorage.setItem('access_token', data.data.access_token);
            localStorage.setItem('refresh_token', data.data.refresh_token);
            localStorage.setItem('user', JSON.stringify(data.data.user));
            
            // Redirect admin to admin panel, others to homepage
            const u = data.data.user || {};
            window.location.href = u.is_admin ? '/features/auth/devices-auth.html' : '/';
          } else {
            throw new Error(data.message || 'Invalid email or password');
          }
        }
      } catch (error) {
        console.error('Login error:', error);
        showError(error.message || 'An error occurred during login');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }
  </script>
</body>
</html>
