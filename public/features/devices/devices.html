<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notelet — อุปกรณ์ทั้งหมด</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/auth.js"></script>
  <script src="/js/chat-notifications.js"></script>
  <style>
    /* NAV */
    .site-header { background: #043873 !important; box-shadow: none; }
    .site-header .logo-text { color: #fff; }
    .site-header .nav a { color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 500; transition: color .2s; }
    .site-header .nav a:hover, .site-header .nav a.active { color: #FFE492; }
    .header-actions .btn-login {
      background: #c97c2c; color: #fff; padding: 9px 24px;
      border-radius: 8px; font-weight: 600; font-size: 14px;
      text-decoration: none; transition: background .2s;
    }
    .header-actions .btn-login:hover { background: #b06920; }

    /* PAGE HEADER BANNER */
    .devices-banner {
      background: #111;
      padding: 40px 0 32px;
      position: relative;
      overflow: hidden;
      min-height: 140px;
    }
    .devices-banner-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.32;
      pointer-events: none;
      z-index: 0;
    }
    .devices-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(4,56,115,0.7) 0%, rgba(4,56,115,0.3) 60%, transparent 100%);
      z-index: 1;
      pointer-events: none;
    }
    .devices-banner .container { position: relative; z-index: 2; }
    .devices-banner-wm {
      position: absolute; right: -20px; top: 50%; transform: translateY(-50%);
      font-size: clamp(80px, 12vw, 160px); font-weight: 900;
      color: rgba(180,140,60,0.18); letter-spacing: -4px;
      user-select: none; pointer-events: none; line-height: 1; white-space: nowrap;
    }
    .devices-banner h1 { color: #fff; font-size: clamp(24px, 4vw, 38px); font-weight: 700; margin-bottom: 6px; position: relative; z-index: 1; }
    .devices-banner p { color: rgba(255,255,255,0.6); font-size: 15px; position: relative; z-index: 1; }

    /* FILTER BAR */
    .filter-bar {
      background: #fff; border-bottom: 1px solid #e8ecf4;
      padding: 16px 0; position: sticky; top: 72px; z-index: 40;
    }
    .filter-inner {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .filter-search {
      display: flex; gap: 8px; flex: 1; max-width: 400px;
    }
    .filter-search input {
      flex: 1; padding: 9px 14px; border: 1.5px solid #dde3ec;
      border-radius: 8px; font-size: 14px; outline: none; transition: border-color .2s;
    }
    .filter-search input:focus { border-color: #4F9CF9; }
    .filter-search button {
      background: #4F9CF9; color: #fff; border: none; border-radius: 8px;
      padding: 9px 16px; cursor: pointer; font-size: 14px; font-weight: 600;
      transition: background .2s;
    }
    .filter-search button:hover { background: #3d8de6; }
    .filter-tabs { display: flex; gap: 8px; }
    .filter-tab {
      padding: 8px 18px; border: 1.5px solid #dde3ec; border-radius: 20px;
      background: #fff; font-size: 13px; font-weight: 600; color: #444;
      cursor: pointer; transition: all .2s;
    }
    .filter-tab.active, .filter-tab:hover { background: #043873; color: #fff; border-color: #043873; }
    .filter-sort {
      margin-left: auto; padding: 9px 12px; border: 1.5px solid #dde3ec;
      border-radius: 8px; font-size: 13px; background: #fff; outline: none;
    }

    /* DEVICE GRID */
    .devices-section { background: #f4f6fa; min-height: calc(100vh - 200px); padding: 36px 0 60px; }
    .devices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .device-card {
      background: #fff; border-radius: 14px; overflow: hidden;
      box-shadow: 0 2px 10px rgba(4,56,115,0.07);
      transition: transform .2s, box-shadow .2s;
      display: flex; flex-direction: column;
      cursor: pointer; text-decoration: none; color: inherit;
    }
    .device-card:hover { transform: translateY(-5px); box-shadow: 0 10px 28px rgba(4,56,115,0.13); }
    .device-card-img {
      width: 100%; aspect-ratio: 4/3; background: #C4DEFD;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; overflow: hidden; position: relative;
    }
    .device-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .device-card-img .placeholder-icon { font-size: 56px; color: #8baed4; }
    .device-badge {
      position: absolute; top: 10px; left: 10px;
      background: #22c55e; color: #fff; font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
    }
    .device-badge.available   { background: #22c55e; }
    .device-badge.delivered   { background: #f97316; }
    .device-badge.returned    { background: #3b82f6; }
    .device-badge.overdue     { background: #ef4444; }
    .device-badge.reserved    { background: #a855f7; }
    .device-badge.rented      { background: #0ea5e9; }
    .device-badge.unavailable { background: #ef4444; }
    .device-card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .device-card-meta { font-size: 12px; color: #888; margin-bottom: 14px; }
    .device-brand { font-size: 11px; font-weight: 600; color: #7b8ab8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .device-card-name { font-size: 16px; font-weight: 700; color: #1e2d4a; margin-bottom: 6px; line-height: 1.3; }
    .device-card-price { font-size: 18px; font-weight: 700; color: #043873; margin-bottom: 12px; }
    .device-card-price span { font-size: 12px; font-weight: 400; color: #999; }
    .device-card-meta { font-size: 12px; color: #888; margin-bottom: 14px; }
    .device-card-btn {
      margin-top: auto; width: 100%; padding: 10px; background: #043873; color: #fff;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .device-card-btn:hover { background: #0a5ba8; }
    .device-card-btn.borrow { background: #4F9CF9; }
    .device-card-btn.borrow:hover { background: #3d8de6; }
    /* Admin device card — blue theme */
    .device-card.admin-card { border: 2px solid #4F9CF9; box-shadow: 0 2px 18px rgba(79,156,249,0.22); background: #f0f7ff; }
    .device-card.admin-card .device-card-img { background: linear-gradient(135deg,#b8d8ff,#dbeeff); }
    .device-card.admin-card .device-card-body { background: #f0f7ff; }
    .device-card.admin-card .device-card-name { color: #0a3d7a; }
    .device-card.admin-card .device-brand { color: #4F9CF9; }
    .device-card.admin-card .device-card-price { color: #0a5ba8; font-size:14px; }
    .admin-icon-badge {
      position: absolute; top: 10px; right: 10px;
      background: linear-gradient(135deg,#4F9CF9,#043873);
      color: #fff; font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
    }

    /* EMPTY STATE */
    .devices-empty { text-align: center; padding: 80px 20px; color: #aaa; }
    .devices-empty .icon { font-size: 56px; margin-bottom: 16px; }
    .devices-empty p { font-size: 16px; }

    /* PAGINATION */
    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 40px; }
    .page-btn {
      width: 38px; height: 38px; border: 1.5px solid #dde3ec; border-radius: 8px;
      background: #fff; font-size: 14px; font-weight: 600; color: #444;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .page-btn.active, .page-btn:hover { background: #043873; color: #fff; border-color: #043873; }

    /* FOOTER */
    .lc-footer { background: #111; color: rgba(255,255,255,0.5); text-align: center; padding: 20px; font-size: 13px; }

    /* STAR RATING */
    .star-row { display:inline-flex; align-items:center; gap:1px; }
    .star-f { color:#f59e0b; font-size:14px; line-height:1; }
    .star-e { color:#d1d5db; font-size:14px; line-height:1; }
    .star-h {
      font-size:14px; line-height:1;
      background: linear-gradient(90deg, #f59e0b 55%, #d1d5db 55%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .star-score { font-size:12px; color:#888; margin-left:5px; font-weight:600; }
  </style>
</head>
<body>

  <!-- NAV -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <div class="logo-mark"></div>
        <div class="logo-text">NOTELET</div>
      </a>
      <nav class="nav">
        <a href="/">หน้าแรก</a>
        <a href="/features/devices/devices.html" class="active">ค้นหาอุปกรณ์</a>
        <a href="/features/devices/rentout.html">จัดการอุปกรณ์</a>
        <a href="/features/devices/devicehistory.html">ประวัติการยืม</a>
      </nav>
      <div class="header-actions" id="headerActions">
        <a href="/features/auth/login.html" class="btn-login">Login</a>
      </div>
    </div>
  </header>

  <!-- PAGE HEADER -->
  <div class="devices-banner">
    <video class="devices-banner-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="/video/3188-166339073.mp4" type="video/mp4">
    </video>
    <div class="container">
      <h1>อุปกรณ์ทั้งหมด</h1>
      <p>เลือกอุปกรณ์ที่ต้องการยืมหรือเช่าได้เลย</p>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <div class="container filter-inner">
      <div class="filter-search">
        <input type="text" id="searchInput" placeholder="ค้นหาอุปกรณ์..." />
        <button id="searchBtn">&#128269; ค้นหา</button>
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-cat="all">ทั้งหมด</button>
        <button class="filter-tab" data-cat="computer">Notebook</button>
        <button class="filter-tab" data-cat="macbook">MacBook</button>
        <button class="filter-tab" data-cat="other">อื่นๆ</button>
      </div>
      <select class="filter-sort" id="sortSelect">
        <option value="newest">ล่าสุด</option>
        <option value="price-asc">ราคา: น้อย → มาก</option>
        <option value="price-desc">ราคา: มาก → น้อย</option>
        <option value="name">ชื่อ A-Z</option>
      </select>
    </div>
  </div>

  <!-- DEVICES -->
  <section class="devices-section">
    <div class="container">
      <div class="devices-grid" id="devicesGrid">
        <!-- Cards will be populated by JS -->
      </div>
      <div class="devices-empty hidden" id="devicesEmpty">
        <div class="icon">📦</div>
        <p>ไม่พบอุปกรณ์ที่ตรงกับการค้นหา</p>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </section>

  <footer class="lc-footer">© 2026 Notelet. All rights reserved.</footer>

  <script>
    // ── Auth state ───────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('access_token');
      const user  = localStorage.getItem('user');
      if (token && user) {
        try {
          const u = JSON.parse(user);
          const ha = document.getElementById('headerActions');
          ha.innerHTML = `<span style="color:#fff;font-size:14px;margin-right:8px;">👤 ${u.name || u.email || 'User'}</span>
            <button onclick="logout()" style="background:#333;color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px;">ออกจากระบบ</button>`;
        } catch(e) {}
      }

      await loadDevices();

      // filter / search events
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentPage = 1;
          renderPage();
        });
      });
      document.getElementById('searchBtn').addEventListener('click', () => { currentPage = 1; renderPage(); });
      document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') { currentPage = 1; renderPage(); } });
      document.getElementById('sortSelect').addEventListener('change', () => { currentPage = 1; renderPage(); });

      // pre-fill search from URL param
      const urlQ = new URLSearchParams(location.search).get('q');
      if (urlQ) { document.getElementById('searchInput').value = urlQ; }
    });

    function logout() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('user');
      window.location.href = '/features/auth/login.html';
    }

    // ── Data ─────────────────────────────────────────────────────
    let allDevices = [];
    let currentPage = 1;
    const PAGE_SIZE = 12;

    async function loadDevices() {
      try {
        const token = localStorage.getItem('access_token');
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        // /api/devices/browse is public – shows only Available devices, no auth needed
        const res = await fetch('/api/devices/browse', { headers });
        if (res.ok) {
          const json = await res.json();
          // Response: { success, message, data: [...] }
          const raw = json.data;
          allDevices = Array.isArray(raw) ? raw : [];
        }
      } catch(e) {
        allDevices = [];
      }
      renderPage();
    }

    function getFiltered() {
      const q    = document.getElementById('searchInput').value.trim().toLowerCase();
      const cat  = document.querySelector('.filter-tab.active')?.dataset.cat || 'all';
      const sort = document.getElementById('sortSelect').value;

      let list = allDevices.filter(d => {
        const name  = (d.name || '').toLowerCase();
        const type  = (d.type || '').toLowerCase();
        const matchQ   = !q || name.includes(q) || type.includes(q);
        const matchCat = cat === 'all'
          || (cat === 'computer' && type.includes('notebook'))
          || (cat === 'macbook'  && type.includes('macbook'))
          || (cat === 'other'    && !type.includes('notebook') && !type.includes('macbook'));
        return matchQ && matchCat;
      });

      if (sort === 'price-asc')  list.sort((a,b) => (a.price||0) - (b.price||0));
      if (sort === 'price-desc') list.sort((a,b) => (b.price||0) - (a.price||0));
      if (sort === 'name')       list.sort((a,b) => (a.name||'').localeCompare(b.name||''));
      return list;
    }

    function renderPage() {
      const filtered = getFiltered();
      const total = filtered.length;
      const start = (currentPage - 1) * PAGE_SIZE;
      const page  = filtered.slice(start, start + PAGE_SIZE);

      const grid  = document.getElementById('devicesGrid');
      const empty = document.getElementById('devicesEmpty');

      if (page.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        grid.innerHTML = page.map(d => renderCard(d)).join('');
      }
      renderPagination(total);
    }

    function parseImgUrl(raw) {
      if (!raw) return '';
      if (raw.startsWith('[')) {
        try { const a = JSON.parse(raw); return a[0] || ''; } catch(e) {}
      }
      return raw;
    }

    const STATUS_LABEL = {
      'available': 'พร้อมให้เช่า',
      'delivered': 'ส่งมอบแล้ว',
      'returned':  'คืนแล้ว',
      'overdue':   'เกินกำหนด',
      'reserved':  'จองแล้ว',
      'rented':    'กำลังเช่า',
    };

    function renderCard(d) {
      const id         = d.deviceNo || '';
      const name       = d.name || 'อุปกรณ์';
      const deviceType = d.type || '';
      const price      = d.price != null ? `${Number(d.price).toFixed(2)} บาท/วัน` : 'ฟรี';
      const statusKey  = (d.status || '').toLowerCase();
      const badgeLabel = STATUS_LABEL[statusKey] || d.status || 'ไม่ทราบสถานะ';
      const imgUrl     = parseImgUrl(d.imageUrl);
      const isAdmin    = d.isAdminDevice === true;
      const displayPrice = isAdmin ? '📚 ยืมจากคณะ (ฟรี)' : price;
      const cardHref = `/features/devices/rentdevice.html?id=${encodeURIComponent(id)}`;

      const imgHtml = imgUrl
        ? `<img src="${imgUrl}" alt="${name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : '';

      return `
        <a class="device-card${isAdmin ? ' admin-card' : ''}" href="${cardHref}" aria-label="${name}">
          <div class="device-card-img">
            ${imgHtml}
            <span class="placeholder-icon" ${imgUrl ? 'style="display:none"' : ''}>💻</span>
            ${isAdmin
              ? `<span class="device-badge available">ยืมได้</span><span class="admin-icon-badge">🛡️ คณะ</span>`
              : `<span class="device-badge ${statusKey}">${badgeLabel}</span>`
            }
          </div>
          <div class="device-card-body">
            ${deviceType ? `<div class="device-brand">${deviceType}</div>` : ''}
            <div class="device-card-name">${name}</div>
            <div class="device-card-price" style="${isAdmin ? 'color:#0a5ba8;font-size:14px;' : ''}">${displayPrice}</div>
            <div class="device-card-meta" id="star-${id}">${isAdmin ? '' : renderStars(d.rating||0)}</div>
            <button class="device-card-btn${isAdmin ? ' borrow' : ''}" onclick="event.preventDefault();goDevice(${JSON.stringify(id)})">
              ${isAdmin ? '📚 ยืมจากคณะ' : '🛒 เช่าอุปกรณ์'}
            </button>
          </div>
        </a>`;
    }

    function goDevice(id) {
      const token = localStorage.getItem('access_token');
      if (!token) { window.location.href = '/features/auth/login.html?next=' + encodeURIComponent('/features/devices/rentdevice.html?id=' + id); return; }
      window.location.href = '/features/devices/rentdevice.html?id=' + encodeURIComponent(id);
    }

    function renderPagination(total) {
      const pages = Math.ceil(total / PAGE_SIZE);
      const pg = document.getElementById('pagination');
      if (pages <= 1) { pg.innerHTML = ''; return; }
      let html = '';
      for (let i = 1; i <= pages; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
      }
      pg.innerHTML = html;
    }

    function gotoPage(n) { currentPage = n; renderPage(); window.scrollTo({top: 0, behavior: 'smooth'}); }

    /* ── Star renderer ───────────────────────────────────────── */
    function renderStars(rating) {
      const r = Math.min(5, Math.max(0, parseFloat(rating) || 0));
      let html = '<span class="star-row">';
      for (let i = 1; i <= 5; i++) {
        if (r >= i)         html += '<span class="star-f">★</span>';
        else if (r >= i-0.5) html += '<span class="star-h">★</span>';
        else                html += '<span class="star-e">★</span>';
      }
      html += `<span class="star-score">${r.toFixed(1)}</span></span>`;
      return html;
    }

    /* ── Realtime rating refresh (every 30 s) ────────────────── */
    async function refreshRatings() {
      try {
        const token = localStorage.getItem('access_token');
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        const res = await fetch('/api/devices/browse', { headers });
        if (!res.ok) return;
        const json = await res.json();
        const devices = Array.isArray(json.data) ? json.data : [];
        devices.forEach(d => {
          const id  = d.deviceNo || '';
          const el  = document.getElementById('star-' + id);
          if (el) el.innerHTML = renderStars(d.rating || 0);
        });
      } catch(e) {}
    }
    refreshRatings();
    setInterval(refreshRatings, 30000);
  </script>
  <script src="/js/navpopups.js"></script>
</body>
</html>
