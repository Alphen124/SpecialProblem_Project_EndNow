<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notelet — Rent Types</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/auth.js"></script>
</head>
<body>
    <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="Notelet home">
        <div class="logo-mark" aria-hidden></div>
        <div class="logo-text">NOTELET</div>
      </a>
      <nav class="nav">
        <a href="/">หน้าแรก</a>
        <a href="/features/devices/devices.html" class="active">ค้นหาอุปกรณ์</a>
        <a href="/features/devices/rentout.html">จัดการอุปกรณ์</a>
        <a href="/features/devices/devicehistory.html">ประวัติการยืม</a>
      </nav>
      <div class="header-actions" id="headerActions">
        <a href="/features/auth/login.html" class="btn-login">Login</a>
      </div>
    </div>
  </header>

  <main>
    <section class="renttype-page">
      <div class="container">
        <div style="text-align:center;">
          <h1 style="font-size:56px;margin-bottom:28px;font-weight:700;color:#111;">Renting Service</h1>
        </div>
        <div class="renttype-grid">

          <a class="renttype-card" href="/features/devices/renttypedevice.html?type=notebook">
            <div class="renttype-visual"></div>
            <div class="renttype-label">Notebook</div>
          </a>

          <a class="renttype-card" href="/features/devices/renttypedevice.html?type=tablet">
            <div class="renttype-visual"></div>
            <div class="renttype-label">Tablet</div>
          </a>

          <a class="renttype-card" href="/features/devices/renttypedevice.html?type=others">
            <div class="renttype-visual"></div>
            <div class="renttype-label">Others</div>
          </a>

        </div>
      </div>
    </section>
  </main>
  <script>
    // Require authentication
    if (typeof NoteLetAuth !== 'undefined') {
      NoteLetAuth.requireAuth();
    }
  </script>
  <script src="/js/navpopups.js"></script>
  <script>
    (function(){
      const navSearchBtn = document.getElementById('navSearchBtn');
      const headerSearch = document.getElementById('headerSearch');
      const headerSearchInput = document.getElementById('headerSearchInput');
      const headerSearchSubmit = document.getElementById('headerSearchSubmit');
      if(!navSearchBtn || !headerSearch) return;

      function showSearch(){ navSearchBtn.style.display='none'; headerSearch.classList.remove('hidden'); headerSearchInput && headerSearchInput.focus(); }
      function hideSearch(){ headerSearch.classList.add('hidden'); navSearchBtn.style.display=''; }

      navSearchBtn.addEventListener('click',(e)=>{ e.preventDefault(); showSearch(); });
      headerSearchSubmit && headerSearchSubmit.addEventListener('click', ()=>{
        const q = headerSearchInput.value.trim(); if(!q) return; window.location.href = '/features/devices/renttypedevice.html?type=search&q='+encodeURIComponent(q);
      });
      headerSearchInput && headerSearchInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); headerSearchSubmit.click(); } else if(e.key==='Escape'){ hideSearch(); } });
      document.addEventListener('click',(e)=>{ if(!headerSearch.contains(e.target) && e.target !== navSearchBtn) hideSearch(); });
    })();
  </script>
</body>
</html>
